name: Inspect V17 rebootCheck

on:
  push:
    branches:
      - diagnostic/v17-squashfs-check
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools binutils binutils-arm-linux-gnueabihf file python3
      - name: Extract V17 root filesystem
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          image = Path("v17_current_backup.bin").read_bytes()
          assert len(image) == 16777216
          assert image[0x560000:0x560004] == b'hsqs'
          Path("v17-rootfs.squashfs").write_bytes(image[0x560000:0xF60000])
          PY
          unsquashfs -s v17-rootfs.squashfs | tee squashfs-info.txt
          sudo unsquashfs -d rootfs v17-rootfs.squashfs
          file rootfs/usr/bin/mainsys || true
          find rootfs -iname '*reboot*' -o -name 'init.rc' | sort | tee relevant-files.txt
      - name: Inspect rebootCheck references
        run: |
          set -euxo pipefail
          mkdir -p report
          cp squashfs-info.txt relevant-files.txt report/
          cp rootfs/etc/init.rc report/ 2>/dev/null || true
          cp rootfs/usr/bin/reboot.sh report/ 2>/dev/null || true
          cp rootfs/usr/bin/mainsys report/mainsys
          python3 - <<'PY'
          from pathlib import Path
          image = Path('v17_current_backup.bin').read_bytes()
          Path('report/pre-rootfs-boot-kernel.bin').write_bytes(image[:0x560000])
          PY
          file report/pre-rootfs-boot-kernel.bin > report/boot-kernel-file.txt
          strings -a report/pre-rootfs-boot-kernel.bin | grep -i -E 'watchdog|sunxi_wdt|wdt|reset reason|brown.?out|power.?fail|pmic|shutdown|reboot' > report/kernel-power-strings.txt || true
          find rootfs -type f -print0 | xargs -0 -r grep -a -l -i -E 'watchdog|/dev/watchdog|sunxi_wdt|wdt' > report/rootfs-watchdog-references.txt || true
          find rootfs -type f -print0 | xargs -0 -r grep -a -l -i 'facreset' > report/rootfs-facreset-references.txt || true
          python3 - <<'PY'
          from pathlib import Path
          image = Path('v17_current_backup.bin').read_bytes()
          Path('report/jffs2-overlay.bin').write_bytes(image[0xF60000:])
          PY
          strings -a report/jffs2-overlay.bin | grep -i -C 2 'facreset\|reboot.days\|just.reset' > report/jffs2-reset-strings.txt || true
          strings -a -t x report/mainsys > report/mainsys.strings
          grep -in -C 12 'rebootCheck\|reboot\|power_shutdown\|sys.power.usb\|sys.acc.on\|shutDownSoc2' report/mainsys.strings > report/reboot-strings.txt || true
          readelf -h -A -s report/mainsys > report/mainsys.readelf.txt 2>&1 || true
          arm-linux-gnueabihf-objdump -d -C report/mainsys > report/mainsys.disasm.txt 2>&1 || true
          arm-linux-gnueabihf-nm -D -C report/mainsys > report/mainsys.nm.txt 2>&1 || true
          grep -in -C 8 '1c3414\|1c33bc\|1c3008\|1c488c\|1c44fc\|1c1ccc\|1c1ec8\|1f7094' report/mainsys.disasm.txt > report/power-xrefs.txt || true
          sha256sum v17_current_backup.bin report/mainsys > report/hashes.txt
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: v17-rebootcheck-inspection
          path: report/
          if-no-files-found: error
