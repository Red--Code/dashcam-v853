name: Inspect V17 ACC and backlight paths

on:
  push:
    branches:
      - diagnostic/v17-squashfs-check
    paths:
      - .github/workflows/inspect-v17-acc-path.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact baseline
        uses: actions/checkout@v4

      - name: Install firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xz-utils binutils binutils-arm-linux-gnueabihf

      - name: Verify and extract exact V17 rootfs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="v17_current_backup.bin"
          EXPECTED_SHA="582c23df1f691734ae9a18513686eab4dd44d6b58307824a80e48a0be64fc002"
          test "$(stat -c '%s' "$IMAGE")" -eq 16777216
          ACTUAL_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "V17 baseline SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          dd if="$IMAGE" of="$RUNNER_TEMP/v17-rootfs.squashfs" bs=65536 skip=86 count=160 status=none
          sudo unsquashfs -no-progress -strict-errors -d "$RUNNER_TEMP/v17-rootfs" "$RUNNER_TEMP/v17-rootfs.squashfs"

      - name: Inspect ACC, suspend, and brightness configuration and binaries
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v17-rootfs"
          OUT="$GITHUB_WORKSPACE/v17-acc-inspection"
          mkdir -p "$OUT"
          cp "$ROOT/etc/init.rc" "$OUT/init.rc"
          {
            echo "V17 ACC / suspend / backlight static inspection"
            echo "Baseline SHA-256: $(sha256sum v17_current_backup.bin | awk '{print $1}')"
            echo
            echo "=== init.rc service declarations ==="
            grep -nE '^(service |on |    class |    disabled|    oneshot)' "$ROOT/etc/init.rc" || true
            echo
            echo "=== init.rc ACC / suspend / brightness references ==="
            grep -niE 'acc|suspend|backlight|bright|mainsys|sdcard|logcatch|class_start' "$ROOT/etc/init.rc" || true
            echo
            echo "=== candidate binary files ==="
            find "$ROOT" -type f \( -name '*main*' -o -name '*sdcard*' -o -name '*modem*' -o -name '*power*' -o -name '*bright*' -o -name '*disp*' \) -printf '%p %s bytes\n' | sort
          } > "$OUT/inspection-summary.txt"

          MAIN="$ROOT/usr/bin/mainsys"
          test -s "$MAIN"
          strings -a -n 4 "$MAIN" > "$OUT/mainsys.strings.txt"
          arm-linux-gnueabihf-nm -anC "$MAIN" > "$OUT/mainsys.symbols.txt"
          {
            echo "=== relevant function symbols ==="
            grep -iE 'acc|suspend|bright|backlight|gpio|power|onAcc' "$OUT/mainsys.symbols.txt" || true
            echo
            echo "=== getAccState() disassembly ==="
            arm-linux-gnueabihf-objdump -d -C --disassemble=getAccState "$MAIN"
            echo
            echo "=== suspendCheck() disassembly ==="
            arm-linux-gnueabihf-objdump -d -C --disassemble=suspendCheck "$MAIN"
            echo
            echo "=== onAccChanged() disassembly ==="
            arm-linux-gnueabihf-objdump -d -C --disassemble=onAccChanged "$MAIN"
            echo
            echo "=== related strings with file offsets ==="
            strings -a -t x "$MAIN" | grep -iE 'sys\.mainsys\.acc_read|sys\.acc\.on|persist\.st\.currentbacklight|currentbacklight|gpio11|gpio6|acc|suspend|backlight|brightness|shutDownSoc|power_shutdown' || true
            echo
            echo "=== ELF sections ==="
            arm-linux-gnueabihf-readelf -S "$MAIN"
          } > "$OUT/mainsys-arm-analysis.txt"

          {
            echo "=== ACC / suspend / backlight / GPIO string matches ==="
            grep -niE -C 4 'sys\.mainsys\.acc_read|sys\.acc\.on|persist\.st\.currentbacklight|currentbacklight|gpio11|gpio6|acc|suspend|backlight|brightness|shutDownSoc|power_shutdown' "$OUT/mainsys.strings.txt" || true
            echo
            echo "=== matching config-file lines ==="
            grep -IinE 'sys\.acc\.on|currentbacklight|suspend.waitsec|acc_gpio|acc-gpio|ignition|backlight|sys.mainsys.acc_read' "$ROOT/etc/default.prop" "$ROOT/etc/init.rc" || true
          } > "$OUT/mainsys.relevant.txt"

          echo "Static ARM disassembly complete; no firmware bytes were modified."

      - name: Upload static inspection
        uses: actions/upload-artifact@v4
        with:
          name: v17-acc-backlight-static-inspection
          path: v17-acc-inspection/
          if-no-files-found: error
          retention-days: 14
