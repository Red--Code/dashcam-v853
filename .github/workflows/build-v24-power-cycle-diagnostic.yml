name: V24 power-cycle diagnostic

on:
  push:
    branches:
      - diagnostic/v17-squashfs-check
    paths:
      - .github/workflows/build-v24-power-cycle-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v24:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact V17 baseline
        uses: actions/checkout@v4

      - name: Install firmware tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xz-utils

      - name: Verify exact V17 baseline and extract rootfs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="v17_current_backup.bin"
          EXPECTED_SHA="582c23df1f691734ae9a18513686eab4dd44d6b58307824a80e48a0be64fc002"
          test "$(stat -c '%s' "$IMAGE")" -eq 16777216
          ACTUAL_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "V17 baseline SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          dd if="$IMAGE" of="$RUNNER_TEMP/v17-rootfs.squashfs" bs=65536 skip=86 count=160 status=none
          sudo unsquashfs -no-progress -strict-errors -d "$RUNNER_TEMP/v24-rootfs" "$RUNNER_TEMP/v17-rootfs.squashfs"

      - name: Enable USB power gate and install persistent power recorder
        shell: bash
        run: |
          set -euo pipefail
          sudo python3 - "$RUNNER_TEMP/v24-rootfs" <<'PY'
          import pathlib, subprocess, sys

          root = pathlib.Path(sys.argv[1])
          rc = root / "etc/init.rc"
          lines = rc.read_text(errors="replace").splitlines()

          try:
              on_boot = lines.index("on boot")
              main_index = lines.index("    class_start main", on_boot)
          except ValueError as exc:
              raise SystemExit(f"Cannot locate expected boot block: {exc}")

          command = "    setprop sys.power.usb 1"
          if command in lines:
              raise SystemExit("V24 USB power-present command already exists")
          if main_index == 0 or lines[main_index - 1] != "    class_start core":
              raise SystemExit("Unexpected on-boot order; refusing to patch")
          lines.insert(main_index, command)

          try:
              service_index = lines.index("service logcatch /usr/bin/log_catch.sh")
              class_index = lines.index("    class main", service_index)
          except ValueError:
              raise SystemExit("Cannot locate logcatch service stanza")
          if class_index > service_index + 3:
              raise SystemExit("Unexpected logcatch service stanza")
          try:
              disabled_index = lines.index("    disabled", service_index, service_index + 6)
          except ValueError:
              disabled_index = -1
          if disabled_index >= 0:
              del lines[disabled_index]
          for i in range(len(lines) - 1):
              if lines[i] == "on property:persist.debug.log.enable=1" and lines[i + 1] == "    start logcatch":
                  del lines[i:i + 2]
                  break
          else:
              raise SystemExit("Expected old logcatch property trigger not found")
          rc.write_text("\n".join(lines) + "\n")

          script_text = """#!/bin/sh
          # V24 power-cycle recorder. Do not change the GUI brightness.
          is_extsd_mounted() {
              awk '$2 == "/mnt/extsd" { found=1 } END { exit !found }' /proc/mounts
          }
          read_file() {
              if [ -r "$1" ]; then
                  printf '%s=' "$1"
                  cat "$1" 2>/dev/null | tr '\\n' ' '
                  echo
              else
                  printf '%s=<unavailable>\\n' "$1"
              fi
          }
          read_power_supplies() {
              found=0
              for p in /sys/class/power_supply/*; do
                  [ -e "$p" ] || continue
                  found=1
                  echo "POWER_SUPPLY=$p"
                  for f in type online present status health capacity voltage_now voltage_avg voltage_ocv current_now current_avg power_now temp; do
                      if [ -r "$p/$f" ]; then
                          printf '  %s=' "$f"
                          cat "$p/$f" 2>/dev/null | tr '\\n' ' '
                          echo
                      fi
                  done
                  if [ -r "$p/uevent" ]; then
                      sed 's/^/  /' "$p/uevent"
                  fi
              done
              [ "$found" -eq 1 ] || echo "POWER_SUPPLY=<no sysfs power_supply entries>"
          }
          read_switch_gpio() {
              for f in /sys/devices/platform/switch-gpio/power_shutdown /sys/devices/platform/switch-gpio/audio_pa /sys/devices/platform/switch-gpio/gps_ant_en; do
                  read_file "$f"
              done
          }
          read_thermal() {
              for f in /sys/class/thermal/thermal_zone*/temp; do
                  [ -r "$f" ] && read_file "$f"
              done
          }
          props() {
              echo "sys.power.usb=$(getprop sys.power.usb)"
              echo "sys.acc.on=$(getprop sys.acc.on)"
              echo "persist.st.currentbacklight=$(getprop persist.st.currentbacklight)"
              echo "persist.st.max_backlight=$(getprop persist.st.max_backlight)"
              echo "persist.suspend.waitsec=$(getprop persist.suspend.waitsec)"
          }

          waited=0
          while ! is_extsd_mounted; do
              sleep 1
              waited=$((waited + 1))
          done

          LOG_DIR="/mnt/extsd/log"
          mkdir -p "$LOG_DIR" || exit 1
          DIAG="$LOG_DIR/v24_power_diag.txt"
          TIMELINE="$LOG_DIR/v24_power_timeline.txt"
          {
              echo "===== V24 boot marker ====="
              date
              echo "logger_waited_seconds=$waited"
              echo "--- uptime and boot information ---"
              read_file /proc/uptime
              read_file /proc/cmdline
              read_file /proc/sys/kernel/random/boot_id
              props
              echo "--- previous boot crash records, if supported ---"
              if [ -r /proc/last_kmsg ]; then
                  cat /proc/last_kmsg
              else
                  echo "/proc/last_kmsg unavailable"
              fi
              for f in /sys/fs/pstore/*; do
                  [ -r "$f" ] || continue
                  echo "===== PSTORE $f ====="
                  cat "$f"
              done
              echo "--- power supply ---"
              read_power_supplies
              echo "--- shutdown / board GPIO ---"
              read_switch_gpio
              echo "--- thermal ---"
              read_thermal
              echo "--- regulator summary, if debugfs is available ---"
              read_file /sys/kernel/debug/regulator/regulator_summary
              echo "--- mounts ---"
              cat /proc/mounts
              echo "--- recent kernel messages ---"
              dmesg | tail -n 180
              echo "--- process list ---"
              ps
          } >> "$DIAG" 2>&1
          sync

          # Flush every sample so the final record is useful even after abrupt power loss.
          (
              n=0
              while is_extsd_mounted; do
                  {
                      echo "===== V24 sample $n ====="
                      date
                      read_file /proc/uptime
                      props
                      read_power_supplies
                      read_switch_gpio
                      read_thermal
                  } >> "$TIMELINE" 2>&1
                  sync
                  n=$((n + 1))
                  sleep 1
              done
          ) &
          WATCH_PID=$!

          echo "===== V24 SOC capture started =====" >> "$LOG_DIR/soc_log.txt"
          date >> "$LOG_DIR/soc_log.txt"
          echo "===== V24 kernel capture started =====" >> "$LOG_DIR/ker_log.txt"
          date >> "$LOG_DIR/ker_log.txt"
          sync

          logcat -v threadtime -n 8 -f "$LOG_DIR/soc_log.txt" &
          LOGCAT_PID=$!
          cat /proc/kmsg >> "$LOG_DIR/ker_log.txt" &
          KMSG_PID=$!

          wait "$WATCH_PID"
          kill "$LOGCAT_PID" "$KMSG_PID" 2>/dev/null || true
          sync
          """
          script = root / "usr/bin/log_catch.sh"
          script.write_text(script_text)
          script.chmod(0o755)
          if subprocess.run(["/bin/sh", "-n", str(script)]).returncode:
              raise SystemExit("V24 logger shell syntax check failed")

          print("V24 sets sys.power.usb=1 before class_start main.")
          print("V24 enables logcatch automatically and records one-second, synced power samples.")
          print("V24 records power_supply, GPIO, thermal, pstore/last_kmsg and boot uptime when available.")
          print("V24 does not modify mainsys, GUI brightness, kernel or JFFS2.")
          PY

      - name: Rebuild and validate SquashFS
        shell: bash
        run: |
          set -euo pipefail
          sudo mksquashfs "$RUNNER_TEMP/v24-rootfs" "$RUNNER_TEMP/v24-rootfs.squashfs" -noappend -comp xz -b 256K -Xdict-size 256K -processors 1 -no-progress
          test "$(stat -c '%s' "$RUNNER_TEMP/v24-rootfs.squashfs")" -le 10485760
          sudo unsquashfs -no-progress -strict-errors -d "$RUNNER_TEMP/v24-rootfs-check" "$RUNNER_TEMP/v24-rootfs.squashfs"
          python3 - "$RUNNER_TEMP/v24-rootfs.squashfs" "$RUNNER_TEMP/v24-rootfs-check" <<'PY'
          import lzma, pathlib, sys
          data = pathlib.Path(sys.argv[1]).read_bytes()
          magic = b"\xfd7zXZ\x00"
          counts = {}
          valid = 0
          pos = 0
          while True:
              pos = data.find(magic, pos)
              if pos < 0:
                  break
              dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
              try:
                  dec.decompress(data[pos:])
              except lzma.LZMAError:
                  pos += 1
                  continue
              if dec.eof:
                  cid = data[pos+7] & 0x0f
                  counts[cid] = counts.get(cid, 0) + 1
                  valid += 1
              pos += 1
          print(f"Complete XZ streams={valid}; check IDs={counts} (0=None, 1=CRC32, 4=CRC64)")
          if not valid or any(cid not in (0, 1) for cid in counts):
              raise SystemExit("Unsupported or missing XZ check type")

          root = pathlib.Path(sys.argv[2])
          rc = (root / "etc/init.rc").read_text(errors="replace")
          assert rc.count("setprop sys.power.usb 1") == 1
          assert rc.index("setprop sys.power.usb 1") < rc.index("class_start main")
          svc_start = rc.index("service logcatch /usr/bin/log_catch.sh")
          svc_end = rc.find("\nservice ", svc_start + 1)
          service = rc[svc_start:svc_end if svc_end >= 0 else len(rc)]
          assert "    class main" in service
          assert "    disabled" not in service
          assert "on property:persist.debug.log.enable=1" not in rc
          prop = (root / "etc/default.prop").read_text(errors="replace")
          assert "persist.st.currentbacklight=" not in prop
          log = (root / "usr/bin/log_catch.sh").read_text()
          assert "v24_power_timeline.txt" in log
          assert "voltage_now" in log and "power_shutdown" in log
          print("Extracted rootfs confirms USB power gate and synced power-cycle recorder.")
          PY

      - name: Assemble image and verify untouched partitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/v17_current_backup.bin" "$RUNNER_TEMP/v24-rootfs.squashfs" "$GITHUB_WORKSPACE/v24-power-cycle-diagnostic.bin" "$GITHUB_WORKSPACE/v24-report.txt" <<'PY'
          import hashlib, pathlib, sys
          base_path, sqfs_path, out_path, report_path = map(pathlib.Path, sys.argv[1:])
          base = base_path.read_bytes()
          sqfs = sqfs_path.read_bytes()
          start, end = 0x560000, 0xF60000
          if len(base) != 0x1000000:
              raise SystemExit("V17 baseline is not 16 MiB")
          if len(sqfs) > end - start:
              raise SystemExit("V24 SquashFS exceeds rootfs partition")
          candidate = bytearray(base)
          candidate[start:end] = b"\xff" * (end - start)
          candidate[start:start+len(sqfs)] = sqfs
          if candidate[:start] != base[:start] or candidate[end:] != base[end:]:
              raise SystemExit("Bytes outside the rootfs partition changed")
          out_path.write_bytes(candidate)
          rows = [
              "V24 power-cycle diagnostic (bench-only; not a production fix)",
              f"Baseline SHA-256: {hashlib.sha256(base).hexdigest()}",
              f"Candidate SHA-256: {hashlib.sha256(candidate).hexdigest()}",
              f"Candidate size: {len(candidate)}",
              f"SquashFS size: {len(sqfs)}",
              "Changed rootfs files: /etc/init.rc, /usr/bin/log_catch.sh",
              "Boot command: setprop sys.power.usb 1 before class_start main",
              "Logger: automatic class main start; one-second synced power timeline",
              "Power telemetry: /sys/class/power_supply, switch-gpio, thermal, pstore, last_kmsg",
              "No GUI brightness change: YES",
              "Boot/kernel partition unchanged: YES",
              "JFFS2 overlay unchanged: YES",
              "XZ streams validated as none/CRC32 only: YES",
          ]
          report_path.write_text("\n".join(rows) + "\n")
          print("\n".join(rows))
          PY

      - name: Upload V24 diagnostic candidate
        uses: actions/upload-artifact@v4
        with:
          name: v24-power-cycle-diagnostic
          path: |
            v24-power-cycle-diagnostic.bin
            v24-report.txt
          if-no-files-found: error
          retention-days: 14
