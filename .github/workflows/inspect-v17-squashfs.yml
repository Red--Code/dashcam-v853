name: V17 read-only SquashFS diagnosis

on:
  push:
    branches:
      - diagnostic/v17-squashfs-check

permissions:
  contents: read

jobs:
  inspect-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Verify exact V17 backup
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="v17_current_backup.bin"
          EXPECTED_SHA="582c23df1f691734ae9a18513686eab4dd44d6b58307824a80e48a0be64fc002"
          EXPECTED_SIZE=16777216
          ACTUAL_SIZE="$(stat -c '%s' "$IMAGE")"
          ACTUAL_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Image size: $ACTUAL_SIZE"
          echo "Image SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact V17 backup confirmed."

      - name: Install SquashFS inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools file binutils

      - name: Extract rootfs and decode superblock fields
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="v17_current_backup.bin"
          ROOTFS="$RUNNER_TEMP/v17-rootfs.squashfs"
          dd if="$IMAGE" of="$ROOTFS" bs=65536 skip=86 count=160 status=progress
          echo "Rootfs bytes 0..127:"
          od -Ax -tx1 -N128 "$ROOTFS"
          python3 - "$ROOTFS" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read(128)
          u32 = lambda off: struct.unpack_from("<I", data, off)[0]
          u16 = lambda off: struct.unpack_from("<H", data, off)[0]
          u64 = lambda off: struct.unpack_from("<Q", data, off)[0]
          flags = u16(26)
          print(f"magic={data[:4]!r}")
          print(f"inodes={u32(4)} block_size={u32(12)} fragments={u32(16)}")
          print(f"compression_id={u16(20)} block_log={u16(22)} flags=0x{flags:04x}")
          print(f"COMP_OPT(bit 10)={(flags >> 10) & 1}")
          print(f"bytes_used={u64(40)}")
          print(f"superblock_size=96")
          header = u16(96)
          stored_len = header & 0x7fff
          uncompressed = bool(header & 0x8000)
          print(f"compressor-options metadata header=0x{header:04x}, length={stored_len}, uncompressed={uncompressed}")
          opts = data[98:98+stored_len]
          print(f"compressor-options bytes={opts.hex()}")
          if len(opts) >= 8:
              dictionary_size, filter_flags = struct.unpack_from("<II", opts)
              print(f"xz dictionary_size={dictionary_size} (0x{dictionary_size:08x})")
              print(f"xz filter_flags=0x{filter_flags:08x}")
              n = (dictionary_size & -dictionary_size).bit_length()-1 if dictionary_size else -1
              valid = dictionary_size > 0 and (dictionary_size == (1 << n) or dictionary_size == ((1 << n) + (1 << (n+1))))
              print(f"dictionary_size_valid_for_linux_squashfs={valid}")
          else:
              print("compressor options are shorter than the 8-byte XZ options structure")
          PY
          unsquashfs -s "$ROOTFS" || true

      - name: Fully extract and validate SquashFS as root
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/v17-rootfs-extracted"
          sudo mkdir -p "$DEST"
          sudo unsquashfs -no-progress -strict-errors -d "$DEST" "$RUNNER_TEMP/v17-rootfs.squashfs"
          echo "Full filesystem extraction succeeded."
          echo "mainsys metadata:"
          sudo stat "$DEST/usr/bin/mainsys"
          sudo file "$DEST/usr/bin/mainsys"
          sudo readelf -h "$DEST/usr/bin/mainsys"
          echo "mainsys interpreter and dependencies:"
          sudo readelf -l "$DEST/usr/bin/mainsys" | grep -E 'INTERP|Requesting program interpreter' || true
          sudo readelf -d "$DEST/usr/bin/mainsys" | grep NEEDED || true
          echo "Configured dynamic loader:"
          sudo ls -l "$DEST/lib/ld-musl-armhf.so.1" || true
