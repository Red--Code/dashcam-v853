name: V17 read-only SquashFS and XZ stream diagnosis

on:
  push:
    branches:
      - diagnostic/v17-squashfs-check

permissions:
  contents: read

jobs:
  inspect-v17:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Verify exact V17 backup
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="v17_current_backup.bin"
          EXPECTED_SHA="582c23df1f691734ae9a18513686eab4dd44d6b58307824a80e48a0be64fc002"
          EXPECTED_SIZE=16777216
          ACTUAL_SIZE="$(stat -c '%s' "$IMAGE")"
          ACTUAL_SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Image size: $ACTUAL_SIZE"
          echo "Image SHA-256: $ACTUAL_SHA"
          test "$ACTUAL_SIZE" -eq "$EXPECTED_SIZE"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          echo "Exact V17 backup confirmed."

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xz-utils file binutils

      - name: Extract rootfs and parse SquashFS fields correctly
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS="$RUNNER_TEMP/v17-rootfs.squashfs"
          dd if="v17_current_backup.bin" of="$ROOTFS" bs=65536 skip=86 count=160 status=progress
          python3 - "$ROOTFS" <<'PY'
          import struct, sys
          p = sys.argv[1]
          d = open(p, "rb").read()
          u16 = lambda o: struct.unpack_from("<H", d, o)[0]
          u32 = lambda o: struct.unpack_from("<I", d, o)[0]
          u64 = lambda o: struct.unpack_from("<Q", d, o)[0]
          assert d[:4] == b"hsqs", f"bad SquashFS magic: {d[:4]!r}"
          flags = u16(24)
          no_ids = u16(26)
          comp = u16(20)
          block_size = u32(12)
          bytes_used = u64(40)
          print(f"SquashFS magic: {d[:4]!r}")
          print(f"compression_id={comp} (4 means XZ)")
          print(f"block_size={block_size}")
          print(f"flags=0x{flags:04x}")
          print(f"no_ids={no_ids}")
          print(f"COMP_OPT_bit10={(flags >> 10) & 1}")
          print(f"bytes_used={bytes_used}")
          if flags & (1 << 10):
              h = u16(96)
              n = h & 0x7fff
              uncompressed = bool(h & 0x8000)
              opts = d[98:98+n]
              print(f"compressor-options metadata header=0x{h:04x}, payload_length={n}, uncompressed={uncompressed}")
              print(f"compressor-options_payload={opts.hex()}")
              if len(opts) >= 8:
                  dictionary_size, filter_flags = struct.unpack_from("<II", opts)
                  print(f"dictionary_size={dictionary_size} (0x{dictionary_size:08x})")
                  print(f"xz_filter_flags_word=0x{filter_flags:08x}")
                  print(f"additional_option_bytes={opts[8:].hex()}")
              else:
                  raise SystemExit("XZ options payload is shorter than 8 bytes")
          else:
              print("No compressor-options metadata is present.")
          PY
          echo "SquashFS superblock summary:"
          unsquashfs -s "$ROOTFS" || true

      - name: Enumerate every valid embedded XZ stream
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/v17-rootfs.squashfs" "$RUNNER_TEMP/v17-xz-streams" <<'PY'
          import lzma, os, pathlib, sys
          src = pathlib.Path(sys.argv[1]).read_bytes()
          outdir = pathlib.Path(sys.argv[2])
          outdir.mkdir(parents=True, exist_ok=True)
          magic = b"\xfd7zXZ\x00"
          offsets = []
          start = 0
          while True:
              pos = src.find(magic, start)
              if pos < 0:
                  break
              offsets.append(pos)
              start = pos + 1
          print(f"XZ magic candidates found: {len(offsets)}")
          valid = []
          for pos in offsets:
              dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
              try:
                  decoded = dec.decompress(src[pos:])
              except lzma.LZMAError:
                  continue
              if not dec.eof:
                  continue
              consumed = len(src) - pos - len(dec.unused_data)
              if consumed < 32:
                  continue
              idx = len(valid)
              path = outdir / f"stream_{idx:03d}.xz"
              path.write_bytes(src[pos:pos+consumed])
              check_id = src[pos+7] & 0x0f
              valid.append((pos, consumed, len(decoded), check_id, path))
              print(f"stream={idx:03d} rootfs_offset=0x{pos:x} compressed={consumed} uncompressed={len(decoded)} check_id={check_id}")
          print(f"Valid complete XZ streams: {len(valid)}")
          if not valid:
              raise SystemExit("No complete XZ streams could be identified")
          open(outdir / "stream-list.txt", "w").write(
              "".join(f"{p}\t{n}\t{u}\t{c}\n" for p,n,u,c,_ in valid)
          )
          PY
          python3 - "$RUNNER_TEMP/v17-xz-streams" <<'PY'
          import pathlib, subprocess, sys
          d = pathlib.Path(sys.argv[1])
          unique = set()
          failed = []
          streams = sorted(d.glob("stream_*.xz"))
          for p in streams:
              r = subprocess.run(["xz", "--list", "--verbose", "--verbose", str(p)],
                                 text=True, stdout=subprocess.PIPE,
                                 stderr=subprocess.STDOUT)
              lines = r.stdout.splitlines()
              details = [x.strip() for x in lines if "Check:" in x or "Filters:" in x or "LZMA2" in x or "Error" in x or "error" in x]
              unique.update(details)
              if r.returncode:
                  failed.append((p.name, r.returncode, r.stdout[-1000:]))
          print("Unique XZ filter/check details:")
          for x in sorted(unique):
              print(x)
          print(f"xz --list files checked: {len(streams)}")
          print(f"xz --list failures: {len(failed)}")
          for x in failed:
              print(f"FAILED {x[0]} rc={x[1]}: {x[2]}")
          PY

      - name: Strict full filesystem extraction and mainsys inspection
        shell: bash
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/v17-rootfs-extracted"
          sudo mkdir -p "$DEST"
          sudo unsquashfs -no-progress -strict-errors -d "$DEST" "$RUNNER_TEMP/v17-rootfs.squashfs"
          echo "Full filesystem extraction succeeded."
          sudo stat "$DEST/usr/bin/mainsys"
          sudo file "$DEST/usr/bin/mainsys"
          sudo readelf -h "$DEST/usr/bin/mainsys"
          sudo readelf -l "$DEST/usr/bin/mainsys" | grep -E 'INTERP|Requesting program interpreter' || true
          sudo readelf -d "$DEST/usr/bin/mainsys" | grep NEEDED || true

      - name: Inspect SD-card logging configuration (read-only)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/v17-rootfs-extracted"
          python3 - "$ROOT" <<'PY'
          import os, pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          name_re = re.compile(r"log|sd|mount|init|debug", re.I)
          text_re = re.compile(
              rb"logcatch|ker_log\.txt|soc_log\.txt|persist\.debug\.log\.enable|"
              rb"sdcard|extsd|mmcblk|/mnt/|/media/|/storage/|/tmp/|/var/log|"
              rb"fopen|open\(|log_path|logpath|log_dir|logdir",
              re.I
          )
          print("=== Files with logging / SD / init-related names ===")
          for base, dirs, files in os.walk(root):
              for name in sorted(files):
                  p = pathlib.Path(base) / name
                  rel = str(p.relative_to(root))
                  if name_re.search(rel):
                      print(rel)
          print("\n=== Text/binary files containing logging or SD path markers ===")
          hits = 0
          for base, dirs, files in os.walk(root):
              for name in files:
                  p = pathlib.Path(base) / name
                  try:
                      if p.is_symlink() or not p.is_file() or p.stat().st_size > 64*1024*1024:
                          continue
                      data = p.read_bytes()
                  except OSError:
                      continue
                  found = list(text_re.finditer(data))
                  if not found:
                      continue
                  rel = str(p.relative_to(root))
                  print(f"\n--- {rel} ({p.stat().st_size} bytes), {len(found)} matches ---")
                  for m in found[:30]:
                      a, b = max(0, m.start()-100), min(len(data), m.end()+180)
                      snippet = data[a:b].replace(b"\x00", b" ")
                      print(snippet.decode("utf-8", "replace").replace("\n", " ")[:420])
                  hits += len(found)
          print(f"\nTotal matching strings: {hits}")
          print("\n=== Exact SD/log startup files ===")
          for rel in ("usr/bin/log_catch.sh", "etc/init.rc", "etc/init.d/S80mmc", "etc/init.d/S79fat", "etc/init.d/rcS"):
              p = root / rel
              if p.is_file():
                  print(f"\n--- {rel} ---")
                  print(p.read_text(errors="replace"))
          print("\n=== Exact property and SD strings in binaries ===")
          for rel in ("usr/bin/sysd", "usr/bin/mainsys", "usr/lib/libcarutils.so", "usr/bin/jt808"):
              p = root / rel
              if not p.is_file():
                  continue
              data = p.read_bytes()
              print(f"\n--- {rel} ---")
              needles = (b"sys.sd.in", b"sdAvaliable", b"sdcard", b"property_set", b"property_get",
                         b"setprop", b"/mnt/extsd", b"mountpoint", b"vfat")
              for needle in needles:
                  pos = 0
                  found = 0
                  while True:
                      pos = data.find(needle, pos)
                      if pos < 0:
                          break
                      a, b = max(0, pos-180), min(len(data), pos+len(needle)+260)
                      chunk = data[a:b]
                      printable = "".join(chr(c) if 32 <= c < 127 else "." for c in chunk)
                      print(f"offset=0x{pos:x} needle={needle.decode()} context={printable}")
                      pos += len(needle)
                      found += 1
                      if found >= 6:
                          break
              print("Dynamic symbols mentioning property / mount / sd:")
              import subprocess
              for cmd in (["readelf", "-Ws", str(p)], ["objdump", "-T", str(p)]):
                  try:
                      q = subprocess.run(cmd, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      lines = [x for x in q.stdout.splitlines() if re.search(r"property|mount|sdcard|system_property", x, re.I)]
                      for line in lines[:30]:
                          print(line)
                  except Exception as e:
                      print(f"symbol scan error: {e}")
          print("\n=== Every text reference to sys.sd.in ===")
          for base, dirs, files in os.walk(root):
              for name in files:
                  p = pathlib.Path(base) / name
                  try:
                      if p.is_symlink() or not p.is_file() or p.stat().st_size > 16*1024*1024:
                          continue
                      data = p.read_bytes()
                  except OSError:
                      continue
                  if b"sys.sd.in" in data:
                      print(f"{p.relative_to(root)}")
          print("\n=== init.rc service and SD-related context ===")
          for p in sorted(root.rglob("*.rc")):
              try:
                  lines = p.read_text(errors="replace").splitlines()
              except OSError:
                  continue
              keep = set()
              for i, line in enumerate(lines):
                  if re.search(r"logcatch|persist\.debug|sdcard|extsd|mmcblk|mount", line, re.I):
                      keep.update(range(max(0, i-4), min(len(lines), i+7)))
              if keep:
                  print(f"\n--- {p.relative_to(root)} ---")
                  last = -2
                  for i in sorted(keep):
                      if i > last+1:
                          print("...")
                      print(f"{i+1}: {lines[i]}")
                      last = i
          PY

      - name: Map CRC64 stream to extracted file
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/v17-rootfs.squashfs" "$RUNNER_TEMP/v17-xz-streams" "$RUNNER_TEMP/v17-rootfs-extracted" <<'PY'
          import lzma, os, pathlib, sys
          streams_dir = pathlib.Path(sys.argv[2])
          root = pathlib.Path(sys.argv[3])
          rows = (streams_dir / "stream-list.txt").read_text().splitlines()
          crc64 = [r.split(chr(9)) for r in rows if r.split(chr(9))[3] == "4"]
          print(f"CRC64 XZ streams: {len(crc64)}")
          for row in crc64:
              off, compressed, uncompressed, check = row
              matches = []
              for p in sorted(streams_dir.glob("stream_*.xz")):
                  raw = p.read_bytes()
                  if len(raw) > 7 and (raw[7] & 0x0f) == 4:
                      try:
                          block = lzma.decompress(raw, format=lzma.FORMAT_XZ)
                      except lzma.LZMAError:
                          continue
                      matches.append((p, block))
              print(f"CRC64 stream rootfs offset=0x{int(off):x}; compressed={compressed}; uncompressed={uncompressed}")
              found = []
              for p, block in matches:
                  if len(block) != int(uncompressed):
                      continue
                  for base, dirs, files in os.walk(root):
                      for name in files:
                          path = pathlib.Path(base) / name
                          try:
                              if path.is_symlink() or not path.is_file():
                                  continue
                              with path.open("rb") as fh:
                                  data = fh.read()
                              pos = data.find(block)
                              if pos >= 0:
                                  found.append((str(path.relative_to(root)), pos, len(data)))
                          except (OSError, MemoryError):
                              pass
              print("Files containing the exact decoded CRC64 block:")
              for name, pos, size in found:
                  print(f"  {name}: file_offset=0x{pos:x}, file_size={size}")
              if not found:
                  print("No direct file match; stream may belong to an inode metadata or fragment block.")
          PY

      - name: Build V18 CRC32-compatible root filesystem candidate
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/v17-rootfs-extracted"
          NEW="$RUNNER_TEMP/v18-rootfs.squashfs"
          OUT="$RUNNER_TEMP/v18_crc32_rootfs_candidate.bin"
          REPORT="$RUNNER_TEMP/v18_report.txt"
          sudo mksquashfs "$SRC" "$NEW" -noappend -comp xz -b 256K -Xdict-size 256K -processors 1 -no-progress
          echo "New SquashFS size:"
          stat -c '%s bytes' "$NEW"
          python3 - "$NEW" "$RUNNER_TEMP/v18-rootfs-check" <<'PY'
          import lzma, pathlib, struct, sys
          p = pathlib.Path(sys.argv[1])
          d = p.read_bytes()
          u16 = lambda o: struct.unpack_from("<H", d, o)[0]
          u32 = lambda o: struct.unpack_from("<I", d, o)[0]
          u64 = lambda o: struct.unpack_from("<Q", d, o)[0]
          assert d[:4] == b"hsqs", f"rebuilt SquashFS magic invalid: {d[:4]!r}"
          flags = u16(24)
          print(f"Rebuilt flags=0x{flags:04x}; COMP_OPT={(flags >> 10) & 1}")
          print(f"Rebuilt dictionary/block size={u32(12)}")
          print(f"Rebuilt bytes_used={u64(40)}")
          if flags & (1 << 10):
              h = u16(96)
              length = h & 0x7fff
              opts = d[98:98+length]
              print(f"Options metadata header=0x{h:04x}, length={length}, uncompressed={bool(h & 0x8000)}")
              print(f"Options payload={opts.hex()}")
              assert length == 8, f"expected 8-byte standard XZ options, got {length}"
              dictionary, filters = struct.unpack("<II", opts)
              print(f"dictionary_size={dictionary}; bcj_filter_flags=0x{filters:08x}")
              assert dictionary == 262144, "unexpected XZ dictionary size"
              assert filters == 0, "unexpected BCJ filters; candidate is intended to use no BCJ filters"
          else:
              default_dictionary = max(u32(12), 8192)
              print(f"No explicit compressor-options metadata; Linux SquashFS default dictionary={default_dictionary}")
              if default_dictionary != 262144:
                  raise SystemExit("Unexpected default XZ dictionary size")
          if len(d) > 10 * 1024 * 1024:
              raise SystemExit("Rebuilt filesystem exceeds 10 MiB rootfs partition")
          magic = b"\xfd7zXZ\x00"
          counts = {}
          positions = []
          start = 0
          while True:
              pos = d.find(magic, start)
              if pos < 0:
                  break
              positions.append(pos)
              start = pos + 1
          valid = []
          for pos in positions:
              dec = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=64*1024*1024)
              try:
                  decoded = dec.decompress(d[pos:])
              except lzma.LZMAError:
                  continue
              if not dec.eof:
                  continue
              consumed = len(d) - pos - len(dec.unused_data)
              if consumed < 32:
                  continue
              check = d[pos+7] & 0x0f
              counts[check] = counts.get(check, 0) + 1
              valid.append((pos, consumed, len(decoded), check))
          print(f"Valid XZ stream candidates={len(valid)}; check-ID counts={counts}")
          print("Check ID 0=none, 1=CRC32, 4=CRC64.")
          if not valid:
              raise SystemExit("No complete XZ streams found in rebuilt filesystem")
          if any(check not in (0, 1) for _,_,_,check in valid):
              raise SystemExit("Rebuilt filesystem still contains XZ checks unsupported by Linux 4.9")
          pathlib.Path(sys.argv[2]).write_text(
              "\n".join(f"0x{pos:x}\t{size}\t{out}\t{check}" for pos,size,out,check in valid)
          )
          PY
          sudo mkdir -p "$RUNNER_TEMP/v18-rootfs-extracted"
          sudo unsquashfs -no-progress -strict-errors -d "$RUNNER_TEMP/v18-rootfs-extracted" "$NEW"
          python3 - "$SRC" "$RUNNER_TEMP/v18-rootfs-extracted" <<'PY'
          import hashlib, os, pathlib, stat, sys
          def manifest(root):
              root = pathlib.Path(root)
              out = {}
              for p in [root] + sorted(root.rglob("*"), key=lambda x: str(x.relative_to(root))):
                  rel = "." if p == root else str(p.relative_to(root))
                  st = p.lstat()
                  mode = stat.S_IMODE(st.st_mode)
                  common = (stat.S_IFMT(st.st_mode), mode, st.st_uid, st.st_gid)
                  if stat.S_ISLNK(st.st_mode):
                      out[rel] = common + ("link", os.readlink(p))
                  elif stat.S_ISREG(st.st_mode):
                      h = hashlib.sha256()
                      with p.open("rb") as f:
                          for chunk in iter(lambda: f.read(1024*1024), b""):
                              h.update(chunk)
                      out[rel] = common + ("file", st.st_size, h.hexdigest())
                  elif stat.S_ISDIR(st.st_mode):
                      out[rel] = common + ("dir",)
                  elif stat.S_ISCHR(st.st_mode) or stat.S_ISBLK(st.st_mode):
                      out[rel] = common + ("device", st.st_rdev)
                  elif stat.S_ISFIFO(st.st_mode):
                      out[rel] = common + ("fifo",)
                  else:
                      out[rel] = common + ("other",)
              return out
          a = manifest(sys.argv[1])
          b = manifest(sys.argv[2])
          if a != b:
              keys = sorted(set(a) | set(b))
              differences = [k for k in keys if a.get(k) != b.get(k)]
              print("Filesystem manifest differences:")
              for k in differences[:50]:
                  print(k, "SOURCE=", a.get(k), "REBUILT=", b.get(k))
              raise SystemExit(f"Manifest mismatch: {len(differences)} entries")
          print(f"Exact file tree/content/ownership/mode match: {len(a)} entries")
          PY
          python3 - "$GITHUB_WORKSPACE/v17_current_backup.bin" "$NEW" "$OUT" "$REPORT" <<'PY'
          import hashlib, pathlib, sys
          base_path, sqfs_path, out_path, report_path = map(pathlib.Path, sys.argv[1:])
          base = bytearray(base_path.read_bytes())
          sqfs = sqfs_path.read_bytes()
          start, end = 0x560000, 0xF60000
          part_size = end - start
          if len(base) != 0x1000000:
              raise SystemExit(f"Wrong baseline size: {len(base)}")
          if len(sqfs) > part_size:
              raise SystemExit(f"Rebuilt SquashFS too large: {len(sqfs)} > {part_size}")
          candidate = bytearray(base)
          candidate[start:end] = b"\xff" * part_size
          candidate[start:start+len(sqfs)] = sqfs
          if candidate[:start] != base[:start]:
              raise SystemExit("Unexpected changes before rootfs")
          if candidate[end:] != base[end:]:
              raise SystemExit("Unexpected changes after rootfs (JFFS2 overlay / remaining flash)")
          out_path.write_bytes(candidate)
          sha = hashlib.sha256(candidate).hexdigest()
          baseline_sha = hashlib.sha256(base).hexdigest()
          r = [
              "V18 CRC32-compatible rootfs candidate (NOT FLASHED)",
              f"Baseline SHA-256: {baseline_sha}",
              f"Candidate SHA-256: {sha}",
              f"Candidate image size: {len(candidate)}",
              f"New SquashFS file size: {len(sqfs)}",
              f"Rootfs partition: 0x{start:06x}..0x{end:06x} ({part_size} bytes)",
              "Bytes before rootfs unchanged: YES",
              "JFFS2 and all bytes after 0xF60000 unchanged: YES",
              "Unused rootfs partition tail erased to 0xFF: YES",
          ]
          report_path.write_text("\n".join(r) + "\n")
          print("\n".join(r))
          PY

      - name: Upload V18 candidate and report
        uses: actions/upload-artifact@v4
        with:
          name: v18-crc32-rootfs-candidate
          path: |
            ${{ runner.temp }}/v18_crc32_rootfs_candidate.bin
            ${{ runner.temp }}/v18_report.txt
            ${{ runner.temp }}/v18-rootfs-check
          if-no-files-found: error
          retention-days: 30
